name: Update ロト6 / ロト7 results

on:
  schedule:
    # Tirages 18:45 JST (09:45 UTC) lundi, jeudi (ロト6) et vendredi (ロト7). Passage toutes les 2 h.
    - cron: "40 */2 * * *"
  workflow_dispatch:

permissions:
  contents: write

jobs:
  update:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - name: Results with real prizes (v5) — échec BRUYANT si les deux sources divergent
        run: python3 scripts/jp_results.py
      - name: Commit if changed
        run: |
          git config user.name "results-bot"
          git config user.email "actions@github.com"
          git add jp_results.json
          if ! git diff --cached --quiet; then
            git commit -m "results: $(date -u +%Y-%m-%dT%H:%MZ)"
            git pull --rebase origin main
            git push
          else
            echo "No change."
          fi
